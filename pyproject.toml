[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipper"
version = "0.0.0"
description = "Local-first AI clipping tool: long-form video to review-ready 9:16 captioned short-form clips (one authorized creator)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ray" }]
classifiers = [
  "Private :: Do Not Upload",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "anthropic>=0.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Native ML wheels (ctranslate2) — installed in Phase 1, kept out of the core
# install so the skeleton sets up cleanly. Sized for the 8 GB M1 Air.
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16", "mypy>=2.1,<3"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# typer expresses CLI params as `typer.Option(...)`/`typer.Argument(...)` in
# argument defaults by design; B008 (no function calls in defaults) is the
# wrong lint for this framework idiom.
"src/clipper/cli.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests that shell out to ffmpeg/whisper; skipped when unavailable"]

[tool.mypy]
python_version = "3.11"
files = ["src/clipper"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# faster-whisper ships no py.typed. Silence its untyped/missing-import here
# (robust across mypy versions and the .[dev] vs .[dev,transcribe] installs)
# rather than via an inline ignore whose error code drifts between mypy majors.
[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true
